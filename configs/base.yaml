# モデル・損失のハイパーパラメータ (詳細は DESIGN.md §3)
# 週次で値を調整する場合は docs/decisions/ にADRを残すこと。

model:
  d_model: 256   # 駒トークン埋め込みと共有Transformer trunkの隠れ次元
  n_layers: 6    # trunkのTransformer層数
  n_heads: 8     # attentionヘッド数 (利き/関係バイアスを各ヘッドに加算する)
  d_theta: 16    # 性格ベクトルθの次元 (欲求6軸スコアとの内積で手スコアを構成)
  d_mood: 32     # 感情GRUの隠れ状態次元 (features.yaml の mood が true のとき使用)

loss:
  # 統一損失 (DESIGN.md §4):
  #   L = L_policy + c1*L_value + c2*L_desire + lambda_g*L_g - c3*H(pi)
  # L_policy には係数が付かない (蒸留では教師手のクロスエントロピー、RLではPPO損失)。
  lambda_g: 0.01 # 自由項gのL2正則化係数 (欲求で説明できない残差を小さく保つ)
  tau: 1.0       # 全駒softmaxの温度 (小さいほど分布が先鋭化する)
  c1: 1.0        # 価値損失 (V - z)^2 の重み — Phase 1の蒸留から使う
  c2: 0.5        # 欲求補助損失 L_desire (6軸BCE) の重み — Phase 2から使う
  c3: 0.01       # エントロピーボーナスの重み (探索の維持・週8のRLで使用)
                 # 2026-08-31: 0.03/0.02への引き上げをいずれもargmax診断が知識侵食と
                 # 判定したため原値に回帰。H≈1.0はこのモデルの自然な成熟として受容する
                 # (docs/decisions/2026-08-31-ppo-entropy-c3.md)
  # エンジン教師 (2026-09-19、docs/decisions/2026-09-19-treeless-strength-survey.md)。
  # scripts/ops/join_teacher.py が作る *.teacher.npz がある局面だけに効く。
  c_soft: 1.0            # MultiPV の soft target (-Σ q_k log π(a_k)) の重み
  teacher_temp: 200.0    # soft target の温度 (cp)。小さいほど 1 位の手に集中する
  teacher_value_weight: 1.0  # value 教師 (エンジン評価値→[-1,1]) と勝敗 z の混合比。1 = 教師のみ

seed: 42         # 乱数シード (再現性のため全実験で固定)
